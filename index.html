<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Буфер — калькулятор заработка</title>
<style>
:root{
  --bg:#0b0d12;--card:#141821;--card2:#1a1f29;--text:#f5f7fa;--muted:#8d96a6;
  --line:#282e3a;--accent:#5b8cff;--green:#35d07f;--red:#ff5c6c;--radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh;padding:0 14px 28px}
button,input{font:inherit}
.app{width:100%;max-width:520px;margin:0 auto}
.header{padding:18px 4px 12px}
.header h1{font-size:27px;margin:0 0 4px;font-weight:800;letter-spacing:-.6px}
.header p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.label{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-title{font-weight:750;font-size:17px;text-transform:capitalize}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;font-size:20px}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekdays div{text-align:center;color:var(--muted);font-size:11px;padding-bottom:4px}
.day{min-width:0;aspect-ratio:1;border:1px solid transparent;background:transparent;color:var(--text);border-radius:11px;font-size:13px;position:relative}
.day:active{transform:scale(.95)}
.day.muted{color:#454c59}
.day.today{border-color:#4d5870}
.day.workday:not(.selected),.day.weekend:not(.selected),.day.dayoff:not(.selected){background:transparent;border-color:transparent}
.day.selected{background:var(--accent);font-weight:750}
.day.workday::after,.day.dayoff::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;bottom:5px;left:50%;transform:translateX(-50%)}
.day.workday::after{background:var(--green)}
.day.dayoff::after{background:var(--red)}
.day.weekend::after{display:none}
.day.selected::after{display:none}
.day.has-data:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--green);bottom:5px;left:50%;transform:translateX(-50%)}
.day.selected.has-data:after{background:#fff}
.form-grid{display:grid;gap:10px}
.field{position:relative}
.field input{width:100%;height:52px;background:var(--card2);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:20px 12px 5px;outline:none;font-size:17px}
.field input:focus{border-color:var(--accent)}
.field span{position:absolute;left:12px;top:6px;color:var(--muted);font-size:10px;font-weight:650}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.save,.dayoff{width:100%;height:52px;border:0;border-radius:14px;color:#fff;font-weight:750;font-size:15px;transition:.18s}
.save{background:var(--accent)}
.dayoff{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.dayoff.active{background:var(--red);border-color:var(--red);color:#fff}
.save.done{background:var(--green)}
.save:active,.dayoff:active{transform:scale(.985)}
.save.done{background:var(--green)}
.save:active{transform:scale(.985)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:14px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.4px}
.stat .k{font-size:11px;color:var(--muted);margin-top:3px}
.section-title{font-size:17px;font-weight:780;margin:0 0 12px}
.operations{display:grid;gap:8px}
.operation{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:13px;padding:12px}
.op-left{min-width:0}.op-date{font-weight:700;font-size:14px}.op-sub{color:var(--muted);font-size:11px;margin-top:3px}
.op-money{text-align:right;font-weight:800;font-size:15px}
.op-bonus{color:var(--green);font-size:11px;margin-top:3px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.chart-tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;scrollbar-width:none}
.chart-tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:70px;height:36px;border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:10px;font-size:12px;font-weight:700}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-wrap{height:220px;position:relative}
canvas{width:100%;height:100%;display:block}
.export{width:100%;height:48px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:13px;font-weight:750;font-size:15px}
.export:active{transform:scale(.985)}
.export-status{text-align:center;color:var(--green);font-size:11px;margin-top:8px;min-height:14px}
.footer{text-align:center;color:#555d6c;font-size:10px;padding:6px 0 18px}
@media(max-width:360px){body{padding-left:10px;padding-right:10px}.card{padding:13px}.day{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<h1>Буфер</h1><p>Учет заработка по дням</p>
</header>

<section class="card">
<div class="calendar-head">
<button class="icon-btn" id="prevMonth">‹</button>
<div class="month-title" id="monthTitle"></div>
<button class="icon-btn" id="nextMonth">›</button>
</div>
<div class="weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
<div class="days" id="days"></div>
</section>

<section class="card">
<div class="selected-date" id="selectedDate" style="font-size:15px;font-weight:700;margin-bottom:12px"></div>
<div class="form-grid">
<div class="field"><span>ОТРАБОТАНО ЧАСОВ</span><input id="hours" type="number" min="0" step="0.25" inputmode="decimal" placeholder="0"></div>
<div class="field"><span>ЗАРАБОТАНО, ₴</span><input id="money" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></div>
<div class="field"><span>БОНУСЫ, ₴</span><input id="bonus" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></div>
</div>
<div class="action-row"><button class="save" id="save">Сохранить</button><button class="dayoff" id="dayoff">Выходной</button></div>
</section>

<section class="card">
<h2 class="section-title">Итоги за месяц</h2>
<div class="stats">
<div class="stat"><div class="v" id="monthMoney">0 ₴</div><div class="k">Всего заработано</div></div>
<div class="stat"><div class="v" id="monthHours">0 ч</div><div class="k">Отработано часов</div></div>
<div class="stat"><div class="v" id="monthBase">0 ₴</div><div class="k">Основной заработок</div></div>
<div class="stat"><div class="v" id="monthBonus">0 ₴</div><div class="k">Бонусы</div></div>
<div class="stat"><div class="v" id="monthWorkDays">0</div><div class="k">Рабочих дней</div></div>
</div>
</section>

<section class="card">
<h2 class="section-title">Последние 5 операций</h2>
<div class="operations" id="operations"></div>
</section>

<section class="card">
<h2 class="section-title">График заработка</h2>
<div class="chart-tabs">
<button class="tab" data-range="7">Неделя</button>
<button class="tab" data-range="14">2 недели</button>
<button class="tab active" data-range="30">Месяц</button>
<button class="tab" data-range="90">3 месяца</button>
</div>
<div class="chart-wrap"><canvas id="chart"></canvas></div>
</section>

<section class="card">
<h2 class="section-title">Экспорт</h2>
<button class="export" id="exportExcel">Экспортировать в Excel</button>
<div class="export-status" id="exportStatus"></div>
</section>

<div class="footer">Данные хранятся локально на этом устройстве</div>
</div>

<script>
const COOKIE_NAME="buffer_earnings_v2";
const STORAGE_NAME="buffer_earnings_v2";
const state={records:loadData(),viewDate:new Date(),selectedDate:new Date(),range:30};

function loadData(){
  try{
    const cookie=document.cookie.split("; ").find(x=>x.startsWith(COOKIE_NAME+"="));
    if(cookie){
      const data=JSON.parse(decodeURIComponent(cookie.split("=").slice(1).join("=")));
      if(data&&typeof data==="object")return data;
    }
  }catch(e){}
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_NAME)||"null");
    if(data&&typeof data==="object")return data;
  }catch(e){}
  return {};
}
function saveData(){
  const value=encodeURIComponent(JSON.stringify(state.records));
  const expires=new Date();expires.setFullYear(expires.getFullYear()+5);
  document.cookie=COOKIE_NAME+"="+value+"; expires="+expires.toUTCString()+"; path=/; SameSite=Lax";
  try{localStorage.setItem(STORAGE_NAME,JSON.stringify(state.records))}catch(e){}
}
function key(date){
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
}
function dateFromKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function sameDay(a,b){return key(a)===key(b)}
function money(n){return Number(n||0).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₴"}
function hours(n){return Number(n||0).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ч"}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function formatDate(d){return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}


function isWeekend(date){
  const d=date.getDay();
  return d===0 || d===6;
}
function isDayOff(date){
  const r=state.records[key(date)];
  return !!(r && r.dayOff);
}
function isWorkDay(date){
  const r=state.records[key(date)];
  return !!(r && r.dayOff===false);
}
function getMonthKey(date){
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0");
}
function renderCalendar(){
  const y=state.viewDate.getFullYear(),m=state.viewDate.getMonth(),first=new Date(y,m,1);
  const offset=(first.getDay()+6)%7,total=new Date(y,m+1,0).getDate(),prevTotal=new Date(y,m,0).getDate();
  document.getElementById("monthTitle").textContent=state.viewDate.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  const el=document.getElementById("days");el.innerHTML="";
  for(let i=0;i<42;i++){
    let n=i-offset+1,date;
    if(n<1)date=new Date(y,m-1,prevTotal+n);
    else if(n>total)date=new Date(y,m+1,n-total);
    else date=new Date(y,m,n);
    const b=document.createElement("button");b.className="day";
    if(date.getMonth()!==m)b.classList.add("muted");
    if(sameDay(date,new Date()))b.classList.add("today");
    if(isDayOff(date))b.classList.add("dayoff");
    if(sameDay(date,state.selectedDate))b.classList.add("selected");
    if(state.records[key(date)] && !isDayOff(date))b.classList.add("has-data");
    b.textContent=date.getDate();b.onclick=()=>selectDate(date);el.appendChild(b);
  }
}
function selectDate(date){
  state.selectedDate=new Date(date);state.viewDate=new Date(date);
  const rec=state.records[key(date)]||{};
  document.getElementById("selectedDate").textContent=formatDate(date);
  document.getElementById("hours").value=rec.hours??"";
  document.getElementById("money").value=rec.money??"";
  document.getElementById("bonus").value=rec.bonus??"";
  const off=document.getElementById("dayoff");
  off.classList.toggle("active",!!rec.dayOff);
  off.textContent=rec.dayOff?"Выходной ✓":"Выходной";
  renderCalendar();renderMonthStats();renderChart();
}
function getMonthStats(){
  const y=state.viewDate.getFullYear(),m=state.viewDate.getMonth();
  let base=0,bonus=0,totalHours=0;
  Object.entries(state.records).forEach(([k,r])=>{
    const d=dateFromKey(k);
    if(d.getFullYear()===y&&d.getMonth()===m){
      base+=Number(r.money)||0;
      bonus+=Number(r.bonus)||0;
      totalHours+=Number(r.hours)||0;
    }
  });
  const daysInMonth=new Date(y,m+1,0).getDate();
  let workDays=0;
  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(y,m,day);
    const r=state.records[key(d)];
    if(r && r.dayOff===false) workDays++;
  }
  return {base,bonus,total:base+bonus,hours:totalHours,workDays};
}
function renderMonthStats(){
  const s=getMonthStats();
  document.getElementById("monthMoney").textContent=money(s.total);
  document.getElementById("monthHours").textContent=hours(s.hours);
  document.getElementById("monthBase").textContent=money(s.base);
  document.getElementById("monthBonus").textContent=money(s.bonus);
  document.getElementById("monthWorkDays").textContent=s.workDays;
}
function renderOperations(){
  const items=Object.entries(state.records).sort((a,b)=>(b[1].savedAt||0)-(a[1].savedAt||0)).slice(0,5);
  const el=document.getElementById("operations");
  if(!items.length){el.innerHTML='<div class="empty">Операций пока нет</div>';return}
  el.innerHTML=items.map(([k,r])=>{
    const d=dateFromKey(k),total=(Number(r.money)||0)+(Number(r.bonus)||0);
    return `<div class="operation"><div class="op-left">
      <div class="op-date">${d.toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:"numeric"})}</div>
      <div class="op-sub">${hours(r.hours)} · ${money(r.money)}</div></div>
      <div><div class="op-money">${money(total)}</div>${Number(r.bonus)?`<div class="op-bonus">+${money(r.bonus)} бонус</div>`:""}</div>
    </div>`;
  }).join("");
}
function renderChart(){
  const canvas=document.getElementById("chart"),wrap=canvas.parentElement,dpr=Math.max(1,devicePixelRatio||1);
  const w=wrap.clientWidth,h=wrap.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;
  const c=canvas.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const end=startOfDay(state.selectedDate),start=new Date(end);start.setDate(start.getDate()-state.range+1);
  const vals=[];
  for(let i=0;i<state.range;i++){const d=new Date(start);d.setDate(start.getDate()+i);const r=state.records[key(d)]||{};vals.push((Number(r.money)||0)+(Number(r.bonus)||0))}
  const max=Math.max(...vals,1),pad={l:8,r:8,t:18,b:30},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  c.strokeStyle="#282e3a";c.lineWidth=1;
  for(let i=0;i<4;i++){const y=pad.t+ch*i/3;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke()}
  const points=vals.map((v,i)=>({x:pad.l+i/(Math.max(vals.length-1,1))*cw,y:pad.t+ch-(v/max)*ch}));
  c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.strokeStyle="#5b8cff";c.lineWidth=2.5;c.stroke();
  points.forEach((p,i)=>{if(vals[i]>0){c.beginPath();c.arc(p.x,p.y,3,0,Math.PI*2);c.fillStyle="#5b8cff";c.fill()}});
  c.fillStyle="#8d96a6";c.font="10px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  const labels=Math.min(5,state.range);
  for(let i=0;i<labels;i++){const idx=Math.round(i*(state.range-1)/(labels-1||1)),d=new Date(start);d.setDate(start.getDate()+idx);c.fillText(d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"}),Math.max(0,points[idx].x-18),h-8)}
}
function renderAll(){renderCalendar();renderMonthStats();renderOperations();renderChart()}

document.getElementById("prevMonth").onclick=()=>{
  const day=state.selectedDate.getDate();
  state.viewDate.setMonth(state.viewDate.getMonth()-1);
  const max=new Date(state.viewDate.getFullYear(),state.viewDate.getMonth()+1,0).getDate();
  state.selectedDate=new Date(state.viewDate.getFullYear(),state.viewDate.getMonth(),Math.min(day,max));
  selectDate(state.selectedDate);
}
document.getElementById("nextMonth").onclick=()=>{
  const day=state.selectedDate.getDate();
  state.viewDate.setMonth(state.viewDate.getMonth()+1);
  const max=new Date(state.viewDate.getFullYear(),state.viewDate.getMonth()+1,0).getDate();
  state.selectedDate=new Date(state.viewDate.getFullYear(),state.viewDate.getMonth(),Math.min(day,max));
  selectDate(state.selectedDate);
}

document.getElementById("save").onclick=()=>{
  const k=key(state.selectedDate);
  const old=state.records[k]||{};
  const h=Math.max(0,Number(document.getElementById("hours").value)||0);
  const m=Math.max(0,Number(document.getElementById("money").value)||0);
  const b=Math.max(0,Number(document.getElementById("bonus").value)||0);
  if(h===0&&m===0&&b===0&&!old.dayOff) delete state.records[k];
  else state.records[k]={hours:h,money:m,bonus:b,dayOff:false,savedAt:Date.now()};
  saveData();renderAll();selectDate(state.selectedDate);
  const btn=document.getElementById("save");btn.textContent="Добавлено ✓";btn.classList.add("done");
  setTimeout(()=>{btn.textContent="Сохранить";btn.classList.remove("done")},1600);
};

document.getElementById("dayoff").onclick=()=>{
  const k=key(state.selectedDate);
  const old=state.records[k]||{};
  const now=old.dayOff!==true;
  if(now){
    state.records[k]={hours:0,money:0,bonus:0,dayOff:true,savedAt:Date.now()};
  }else{
    state.records[k]={hours:old.hours||0,money:old.money||0,bonus:old.bonus||0,dayOff:false,savedAt:Date.now()};
  }
  saveData();
  selectDate(state.selectedDate);
};

document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");state.range=Number(btn.dataset.range);renderChart();
});

document.getElementById("exportExcel").onclick=async()=>{
  const status=document.getElementById("exportStatus");
  const rows=Object.entries(state.records).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,r])=>{
    const d=dateFromKey(k),base=Number(r.money)||0,bonus=Number(r.bonus)||0;
    return {Дата:d.toLocaleDateString("ru-RU"),"Часы":Number(r.hours)||0,"Заработано":base,"Бонусы":bonus,"Итого":base+bonus};
  });
  if(!rows.length){status.textContent="Нет данных для экспорта";return}
  try{
    if(!window.XLSX){
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
        s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
      });
    }
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Заработок");
    ws["!cols"]=[{wch:14},{wch:10},{wch:15},{wch:12},{wch:15}];
    XLSX.writeFile(wb,"buffer_zarabotok.xlsx");
    status.textContent="Excel-файл подготовлен ✓";
    setTimeout(()=>status.textContent="",2500);
  }catch(e){
    const csv=["Дата;Часы;Заработано;Бонусы;Итого",...rows.map(r=>`${r.Дата};${r.Часы};${r.Заработано};${r.Бонусы};${r.Итого}`)].join("\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="buffer_zarabotok.csv";a.click();URL.revokeObjectURL(a.href);
    status.textContent="Excel недоступен — сохранён CSV ✓";
  }
};

window.addEventListener("resize",renderChart);
selectDate(new Date());
</script>
</body>
</html>
