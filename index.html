<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103b30">
<title>Деберц</title>
<style>
:root{--gold:#f2c66d;--felt:#155b45;--felt2:#0b3027;--paper:#fff8e9}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 35%,#1b7052,var(--felt2) 78%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;touch-action:manipulation}.app{max-width:760px;min-height:100svh;margin:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:950;letter-spacing:.5px}.brand span{color:var(--gold)}.tag{font-size:12px;padding:7px 10px;border:1px solid #ffffff35;border-radius:30px;background:#ffffff12}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score{border:1px solid #ffffff28;background:#ffffff12;border-radius:13px;padding:8px 12px}.score small{opacity:.8}.score b{display:block;color:var(--gold);font-size:23px}
.table{flex:1;min-height:410px;background:#062c23a8;border:1px solid #ffffff25;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.seat{text-align:center;min-height:60px}.name{font-weight:750}.backs{display:flex;justify-content:center;margin-top:5px}.back{width:29px;height:41px;margin-left:-9px;border:2px solid #f5e8c9;border-radius:5px;background:repeating-linear-gradient(45deg,#d8c18d 0 3px,#315e50 3px 6px);box-shadow:0 2px 4px #0005}
.trumpLine{text-align:center;font-size:13px;min-height:29px;color:#fff0c9}.trumpLine strong{font-size:24px;vertical-align:middle;margin:0 4px}
.center{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;align-items:center;min-height:145px}.slot{height:140px;border:1px dashed #ffffff40;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:7px;position:relative;padding-top:12px}.slot:before{content:attr(data-label);position:absolute;top:5px;left:8px;font-size:10px;opacity:.55}
.card{width:clamp(55px,16vw,78px);aspect-ratio:.70;background:var(--paper);color:#18231f;border-radius:9px;border:1px solid #e4d6bd;box-shadow:0 4px 9px #0006;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;font-weight:850;position:relative;animation:cardIn .55s cubic-bezier(.18,.78,.22,1) both}.card .rank{font-size:clamp(17px,5vw,23px);line-height:1}.card .suit{font-size:clamp(18px,5vw,24px);align-self:flex-end}.red{color:#c73535}
@keyframes cardIn{from{opacity:0;transform:translateY(-38px) rotate(-13deg) scale(.78)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
@keyframes dealIn{from{opacity:0;transform:translateY(28px) rotate(7deg) scale(.88)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
.status{text-align:center;min-height:38px;color:#ffedc5;font-size:13px;line-height:1.35;display:flex;align-items:center;justify-content:center}
.hand{display:flex;justify-content:center;gap:clamp(1px,1vw,7px);min-height:104px;padding:4px 0;overflow-x:auto}.hand button{background:none;border:0;padding:0;border-radius:10px;flex:0 0 clamp(46px,13.2vw,70px)}.hand button .card{width:100%;transition:transform .28s ease,filter .28s ease;animation:dealIn .65s cubic-bezier(.18,.78,.22,1) both}.hand button:not(:disabled):active .card{transform:translateY(-9px) scale(1.04)}.hand button:disabled{filter:grayscale(.5);opacity:.72}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:30px;padding:10px 17px;background:var(--gold);color:#2b2416;font-weight:850;box-shadow:0 3px 0 #a77d35}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a77d35}.btn.alt{background:#ffffff18;color:white;border:1px solid #ffffff45;box-shadow:none}
footer{text-align:center;font-size:10px;opacity:.65}
.overlay{position:fixed;inset:0;background:#061a16df;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.show{display:flex}.modal{width:min(420px,100%);background:#fff7e8;color:#20352c;border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 70px #0009}.modal h2{margin:0 0 8px}.modal p{line-height:1.45}.modal .btn{margin-top:10px}
.roulette{width:210px;height:210px;border-radius:50%;margin:20px auto;background:conic-gradient(from -45deg,#fff4d7 0 25%,#d9e8d9 25% 50%,#fff4d7 50% 75%,#d9e8d9 75%);border:9px solid #c79d4c;box-shadow:0 8px 22px #0005;position:relative;transform:rotate(0deg);transition:transform 5.2s cubic-bezier(.08,.76,.12,1);will-change:transform}.roulette:after{content:"";position:absolute;inset:40%;border-radius:50%;background:#f8e8c4;border:4px solid #b78b3c;box-shadow:0 2px 5px #0004}.roulette:before{content:"";position:absolute;top:-17px;left:calc(50% - 13px);border-left:13px solid transparent;border-right:13px solid transparent;border-top:27px solid #a83c32;z-index:3;filter:drop-shadow(0 2px 1px #0005)}.wheelSymbols{position:absolute;inset:0;font-size:42px;font-weight:900;color:#20352c}.wheelSymbols span{position:absolute;transform:translate(-50%,-50%);text-shadow:0 1px 0 #fff}.wheelSymbols span:nth-child(1){left:75%;top:25%}.wheelSymbols span:nth-child(2){left:75%;top:75%;color:#c73535}.wheelSymbols span:nth-child(3){left:25%;top:75%}.wheelSymbols span:nth-child(4){left:25%;top:25%;color:#c73535}
@media(min-width:600px){.table{min-height:480px}.hand{min-height:120px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">♠ ДЕБЕРЦ<span>.</span></div><div class="tag" id="round">До 301 очка</div></header>
<div class="scores"><div class="score"><small>Вы</small><b id="youScore">0</b></div><div class="score"><small>Компьютер</small><b id="cpuScore">0</b></div></div>
<section class="table">
 <div class="seat"><div class="name">🤖 Компьютер</div><div class="backs" id="cpuBack"></div></div>
 <div class="trumpLine" id="trumpLine">Козырь ещё не выбран</div>
 <div class="center"><div class="slot" data-label="Компьютер" id="cpuSlot"></div><div class="slot" data-label="Вы" id="youSlot"></div></div>
 <div class="status" id="status" aria-live="polite">Нажмите «Начать игру».</div>
 <div><div class="name" style="text-align:center;margin-bottom:3px">🙂 Ваши карты</div><div class="hand" id="hand"></div></div>
</section>
<div class="controls"><button class="btn" id="start">Начать игру</button><button class="btn alt" id="rules">Правила</button></div>
<footer>Игра против компьютера · автономная версия</footer>
</div>
<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><p id="modalText"></p><button class="btn" id="modalOk">Продолжить</button></div></div>
<script>
(()=>{
const SUITS=['♠','♥','♦','♣'], isRed=s=>s==='♥'||s==='♦';
const RANKS=['7','8','9','J','Q','K','10','A'];
const NORMAL={'7':0,'8':0,'9':0,'J':2,'Q':3,'K':4,'10':10,'A':11};
const TRUMP={'7':0,'8':0,'Q':3,'K':4,'10':10,'A':11,'9':14,'J':20};
let you=[],cpu=[],stock=[],trump=null,lead=null,turn='you',played={},scores=[0,0],trickPts=[0,0],tricks=0,locked=false,active=false,dealToken=0;
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){return shuffle(SUITS.flatMap(s=>RANKS.map(r=>({s,r,id:r+s}))))}
function points(c){return c.s===trump?TRUMP[c.r]:NORMAL[c.r]}
function strength(c){return (c.s===trump?['7','8','Q','K','10','A','9','J']:RANKS).indexOf(c.r)}
function card(c){return `<div class="card ${isRed(c.s)?'red':''}"><span class="rank">${c.r}</span><span class="suit">${c.s}</span></div>`}
function say(t){$('status').textContent=t}
function render(){
 $('youScore').textContent=scores[0];$('cpuScore').textContent=scores[1];
 $('cpuBack').innerHTML=cpu.map(()=>'<div class="back"></div>').join('');
 $('hand').innerHTML=you.map((c,i)=>`<button data-i="${i}" aria-label="${c.r}${c.s}" ${(!active||turn!=='you'||locked)?'disabled':''}>${card(c)}</button>`).join('');
 $('hand').querySelectorAll('button').forEach((b,i)=>{b.style.animationDelay=`${i*90}ms`;b.addEventListener('click',()=>play('you',Number(b.dataset.i)))});
 $('cpuSlot').innerHTML=played.cpu?card(played.cpu):'';$('youSlot').innerHTML=played.you?card(played.you):'';
 $('trumpLine').innerHTML=trump?`Козырь: <strong style="color:${isRed(trump)?'#ffb0a9':'#fff'}">${trump}</strong> · В колоде: ${stock.length}`:'Козырь ещё не выбран';
 $('round').textContent=`Взятка ${Math.min(tricks+1,16)} / 16`;
}
function modal(title,text,body=''){ $('modalTitle').textContent=title;$('modalText').textContent=text;$('modalBody').innerHTML=body;$('overlay').classList.add('show')}
function closeModal(){ $('overlay').classList.remove('show') }
$('modalOk').onclick=closeModal;
$('rules').onclick=()=>modal('Правила','Упрощённый Деберц на двоих. 32 карты. Сначала рулетка выбирает козырную масть. Нужно отвечать в масть, если она есть. Старший козырь или старшая карта масти хода забирает взятку. Очки: козырный валет — 20, козырная девятка — 14, туз — 11, десятка — 10, король — 4, дама — 3, некозырный валет — 2. В конце сдачи бонус 10 очков победителю последней взятки. Побеждает первый, кто наберёт 301.');
$('start').onclick=async()=>{
 closeModal();scores=[0,0];$('start').disabled=true;
 await newDeal();$('start').disabled=false;
};
async function newDeal(){
 const token=++dealToken;active=false;locked=true;played={};lead=null;trump=null;tricks=0;trickPts=[0,0];
 const d=makeDeck();you=d.splice(0,6);cpu=d.splice(0,6);stock=d;turn='you';render();
 const wheel=`<div class="roulette" id="wheel"><div class="wheelSymbols"><span>♠</span><span>♥</span><span>♣</span><span>♦</span></div></div>`;
 modal('Рулетка выбирает масть','Крутится…',wheel);
 const chosenIndex=Math.floor(Math.random()*SUITS.length);
 // Сектора расположены по часовой стрелке: ♠, ♥, ♣, ♦. Центр выбранного сектора приводим точно под верхний указатель.
 const centerAngle=45+chosenIndex*90;
 const targetAngle=360*9+((270-centerAngle+360)%360);
 await wait(80);
 const wheelEl=$('wheel');if(wheelEl)wheelEl.style.transform=`rotate(${targetAngle}deg)`;
 await wait(5500);if(token!==dealToken)return;
 trump=SUITS[chosenIndex];
 const body=`<div style="font-size:72px;color:${isRed(trump)?'#c73535':'#172820'};margin:10px">${trump}</div>`;
 $('modalBody').innerHTML=body;$('modalTitle').textContent='Ваш козырь';$('modalText').textContent='Рулетка выбрала масть. Удачной игры!';
 await wait(1500);if(token!==dealToken)return;closeModal();
 active=true;locked=false;turn='you';say('Ваш ход — выберите любую карту.');render();
}
function legal(hand,c){if(!lead)return true;return hand.some(x=>x.s===lead.s)?c.s===lead.s:true}
function play(who,index){
 if(!active||locked||turn!==who)return;
 const hand=who==='you'?you:cpu,c=hand[index];if(!c)return;
 if(!legal(hand,c)){say('Нужно положить карту масти хода.');return}
 hand.splice(index,1);played[who]=c;if(!lead)lead=c;
 render();
 if(played.you&&played.cpu){resolveTrick();return}
 turn=who==='you'?'cpu':'you';render();
 if(turn==='cpu'){say('Компьютер думает…');setTimeout(cpuMove,650)}else say('Ваш ход — ответьте картой.');
}
function beats(a,b,leadSuit){
 if(a.s===trump&&b.s!==trump)return true;
 if(a.s!==trump&&b.s===trump)return false;
 if(a.s===b.s)return strength(a)>strength(b);
 return a.s===leadSuit;
}
function cpuMove(){
 if(!active||locked||turn!=='cpu'||played.cpu)return;
 const opts=cpu.map((c,i)=>({c,i})).filter(x=>legal(cpu,x.c));
 if(!opts.length){say('Не удалось выбрать карту. Нажмите на любую карту, чтобы продолжить.');turn='you';render();return}
 let choice;
 if(played.you){const winners=opts.filter(x=>beats(x.c,played.you,lead.s));choice=(winners.length?winners:opts).sort((a,b)=>points(a.c)-points(b.c))[0]}
 else choice=opts.sort((a,b)=>points(a.c)-points(b.c))[0];
 play('cpu',choice.i);
}
async function resolveTrick(){
 if(locked)return;locked=true;render();
 const token=dealToken;
 const winner=beats(played.cpu,played.you,lead.s)?'cpu':'you';
 const pts=points(played.you)+points(played.cpu);trickPts[winner==='you'?0:1]+=pts;
 say(`${winner==='you'?'Вы':'Компьютер'} забирает взятку · ${pts} очков на столе.`);
 await wait(1050);if(token!==dealToken)return;
 if(stock.length>=2){you.push(stock.shift());cpu.push(stock.shift())}
 tricks++;played={};lead=null;
 if(you.length===0&&cpu.length===0){finishDeal();return}
 turn=winner;locked=false;render();
 if(turn==='cpu'){say('Компьютер ходит первым…');setTimeout(cpuMove,550)}
 else say('Ваша очередь! Выберите карту.');
}
function finishDeal(){
 let a=trickPts[0],b=trickPts[1];
 if(a>b)a+=10;else if(b>a)b+=10;else{a+=5;b+=5}
 scores[0]+=a;scores[1]+=b;active=false;locked=true;render();
 const done=scores[0]>=301||scores[1]>=301;
 $('start').textContent=done?'Играть заново':'Следующая сдача';
 $('start').hidden=false;
 modal(done?(scores[0]>scores[1]?'Вы победили! 🎉':'Победил компьютер'):'Сдача завершена',
 `За сдачу: вы — ${a}, компьютер — ${b}. Общий счёт: ${scores[0]} : ${scores[1]}.`);
}
render();
})();
</script>
</body>
</html>
