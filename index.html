<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Буфер — калькулятор заработка</title>
<style>
:root{
  --bg:#0b0d12;--card:#141821;--card2:#1a1f29;--text:#f5f7fa;--muted:#8d96a6;
  --line:#282e3a;--accent:#5b8cff;--green:#35d07f;--red:#ff5c6c;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh;padding:0 14px 28px}
button,input{font:inherit}
.app{width:100%;max-width:520px;margin:0 auto}
.header{padding:18px 4px 12px}
.header h1{font-size:27px;margin:0 0 4px;font-weight:800;letter-spacing:-.6px}
.header p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.label{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-title{font-weight:750;font-size:17px;text-transform:capitalize}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;font-size:20px}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekdays div{text-align:center;color:var(--muted);font-size:11px;padding-bottom:4px}
.day{min-width:0;aspect-ratio:1;border:1px solid transparent;background:transparent;color:var(--text);border-radius:11px;font-size:13px;position:relative}
.day:active{transform:scale(.95)}
.day.muted{color:#454c59}
.day.today{border-color:#4d5870}
.day.selected{background:var(--accent);font-weight:750}
.day.has-data:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--green);bottom:5px;left:50%;transform:translateX(-50%)}
.day.selected.has-data:after{background:#fff}
.form-grid{display:grid;gap:10px}
.field{position:relative}
.field input{width:100%;height:52px;background:var(--card2);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:20px 12px 5px;outline:none;font-size:17px}
.field input:focus{border-color:var(--accent)}
.field span{position:absolute;left:12px;top:6px;color:var(--muted);font-size:10px;font-weight:650}
.save{width:100%;height:52px;margin-top:10px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:750;font-size:16px}
.save:active{transform:scale(.985)}
.selected-date{font-size:15px;font-weight:700;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:14px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.4px}
.stat .k{font-size:11px;color:var(--muted);margin-top:3px}
.section-title{font-size:17px;font-weight:780;margin:0 0 12px}
.operations{display:grid;gap:8px}
.operation{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:13px;padding:12px}
.op-left{min-width:0}.op-date{font-weight:700;font-size:14px}.op-sub{color:var(--muted);font-size:11px;margin-top:3px}
.op-money{text-align:right;font-weight:800;font-size:15px}
.op-bonus{color:var(--green);font-size:11px;margin-top:3px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.chart-tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;scrollbar-width:none}
.chart-tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:70px;height:36px;border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:10px;font-size:12px;font-weight:700}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-wrap{height:220px;position:relative}
canvas{width:100%;height:100%;display:block}
.footer{text-align:center;color:#555d6c;font-size:10px;padding:6px 0 18px}
@media(max-width:360px){
  body{padding-left:10px;padding-right:10px}
  .card{padding:13px}
  .day{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>Буфер</h1>
    <p>Учет заработка по дням</p>
  </header>

  <section class="card">
    <div class="calendar-head">
      <button class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="icon-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
    </div>
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="card">
    <div class="selected-date" id="selectedDate"></div>
    <div class="form-grid">
      <div class="field">
        <span>ОТРАБОТАНО ЧАСОВ</span>
        <input id="hours" type="number" min="0" step="0.25" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <span>ЗАРАБОТАНО, ₴</span>
        <input id="money" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <span>БОНУСЫ, ₴</span>
        <input id="bonus" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <button class="save" id="save">Сохранить</button>
  </section>

  <section class="card">
    <h2 class="section-title">Итоги за месяц</h2>
    <div class="stats">
      <div class="stat"><div class="v" id="monthMoney">0 ₴</div><div class="k">Заработано</div></div>
      <div class="stat"><div class="v" id="monthHours">0 ч</div><div class="k">Отработано</div></div>
      <div class="stat"><div class="v" id="monthBonus">0 ₴</div><div class="k">Бонусы</div></div>
      <div class="stat"><div class="v" id="monthAvg">0 ₴</div><div class="k">Среднее за день</div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">Последние 5 операций</h2>
    <div class="operations" id="operations"></div>
  </section>

  <section class="card">
    <h2 class="section-title">График заработка</h2>
    <div class="chart-tabs">
      <button class="tab" data-range="7">Неделя</button>
      <button class="tab" data-range="14">2 недели</button>
      <button class="tab active" data-range="30">Месяц</button>
      <button class="tab" data-range="90">3 месяца</button>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </section>

  <div class="footer">Данные хранятся локально на этом устройстве</div>
</div>

<script>
const COOKIE_NAME = "buffer_earnings_v1";
const state = {
  records: loadData(),
  viewDate: new Date(),
  selectedDate: new Date(),
  range: 30
};

function cookieEncode(obj){
  return encodeURIComponent(JSON.stringify(obj));
}
function saveData(){
  const expires = new Date();
  expires.setFullYear(expires.getFullYear()+5);
  document.cookie = `${COOKIE_NAME}=${cookieEncode(state.records)}; expires=${expires.toUTCString()}; path=/; SameSite=Lax`;
}
function loadData(){
  const row = document.cookie.split("; ").find(x => x.startsWith(COOKIE_NAME+"="));
  if(!row) return {};
  try{return JSON.parse(decodeURIComponent(row.split("=").slice(1).join("=")))}catch(e){return {}}
}
function key(date){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,"0"), d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function money(n){return `${Number(n||0).toLocaleString("ru-RU",{maximumFractionDigits:2})} ₴`}
function hours(n){return `${Number(n||0).toLocaleString("ru-RU",{maximumFractionDigits:2})} ч`}
function sameDay(a,b){return key(a)===key(b)}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function formatDate(d){return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function renderCalendar(){
  const y=state.viewDate.getFullYear(), m=state.viewDate.getMonth();
  document.getElementById("monthTitle").textContent=state.viewDate.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  const first=new Date(y,m,1);
  let offset=(first.getDay()+6)%7;
  const total=new Date(y,m+1,0).getDate();
  const prevTotal=new Date(y,m,0).getDate();
  const el=document.getElementById("days");
  el.innerHTML="";
  for(let i=0;i<42;i++){
    let dayNum=i-offset+1, date;
    if(dayNum<1) date=new Date(y,m-1,prevTotal+dayNum);
    else if(dayNum>total) date=new Date(y,m+1,dayNum-total);
    else date=new Date(y,m,dayNum);
    const b=document.createElement("button");
    b.className="day";
    if(date.getMonth()!==m)b.classList.add("muted");
    const today=new Date();
    if(sameDay(date,today))b.classList.add("today");
    if(sameDay(date,state.selectedDate))b.classList.add("selected");
    if(state.records[key(date)])b.classList.add("has-data");
    b.textContent=date.getDate();
    b.addEventListener("click",()=>selectDate(date));
    el.appendChild(b);
  }
}
function selectDate(date){
  state.selectedDate=new Date(date);
  state.viewDate=new Date(date);
  const rec=state.records[key(date)]||{};
  document.getElementById("selectedDate").textContent=formatDate(date);
  document.getElementById("hours").value=rec.hours??"";
  document.getElementById("money").value=rec.money??"";
  document.getElementById("bonus").value=rec.bonus??"";
  renderCalendar();
}
function renderMonthStats(){
  const y=state.viewDate.getFullYear(),m=state.viewDate.getMonth();
  let totalMoney=0,totalHours=0,totalBonus=0,days=0;
  Object.entries(state.records).forEach(([k,r])=>{
    const [yy,mm]=k.split("-").map(Number);
    if(yy===y&&mm===m){
      totalMoney+=Number(r.money)||0; totalHours+=Number(r.hours)||0; totalBonus+=Number(r.bonus)||0; days++;
    }
  });
  document.getElementById("monthMoney").textContent=money(totalMoney);
  document.getElementById("monthHours").textContent=hours(totalHours);
  document.getElementById("monthBonus").textContent=money(totalBonus);
  document.getElementById("monthAvg").textContent=money(days?totalMoney/days:0);
}
function renderOperations(){
  const items=Object.entries(state.records)
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .slice(0,5);
  const el=document.getElementById("operations");
  if(!items.length){el.innerHTML='<div class="empty">Операций пока нет</div>';return}
  el.innerHTML=items.map(([k,r])=>{
    const [y,m,d]=k.split("-").map(Number);
    const date=new Date(y,m-1,d);
    return `<div class="operation">
      <div class="op-left"><div class="op-date">${date.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}</div>
      <div class="op-sub">${hours(r.hours)} · ${money(r.money)}</div></div>
      <div><div class="op-money">${money((Number(r.money)||0)+(Number(r.bonus)||0))}</div>
      ${Number(r.bonus)?`<div class="op-bonus">+${money(r.bonus)} бонус</div>`:""}</div>
    </div>`;
  }).join("");
}
function dateFromKey(k){
  const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d);
}
function renderChart(){
  const canvas=document.getElementById("chart"),wrap=canvas.parentElement;
  const dpr=Math.max(1,window.devicePixelRatio||1), w=wrap.clientWidth,h=wrap.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const c=canvas.getContext("2d");c.scale(dpr,dpr);
  c.clearRect(0,0,w,h);
  const end=startOfDay(state.selectedDate);
  const start=new Date(end);start.setDate(start.getDate()-state.range+1);
  const vals=[];
  for(let i=0;i<state.range;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const r=state.records[key(d)]||{};
    vals.push((Number(r.money)||0)+(Number(r.bonus)||0));
  }
  const max=Math.max(...vals,1);
  const pad={l:8,r:8,t:18,b:30},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  c.strokeStyle="#282e3a";c.lineWidth=1;
  for(let i=0;i<4;i++){
    const y=pad.t+ch*i/3;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();
  }
  const points=vals.map((v,i)=>({x:pad.l+(i/(Math.max(vals.length-1,1)))*cw,y:pad.t+ch-(v/max)*ch}));
  if(points.length){
    c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.strokeStyle="#5b8cff";c.lineWidth=2.5;c.stroke();
    points.forEach((p,i)=>{if(vals[i]>0){c.beginPath();c.arc(p.x,p.y,3,0,Math.PI*2);c.fillStyle="#5b8cff";c.fill()}});
  }
  c.fillStyle="#8d96a6";c.font="10px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  const labels=Math.min(5,state.range);
  for(let i=0;i<labels;i++){
    const idx=Math.round(i*(state.range-1)/(labels-1||1)),d=new Date(start);d.setDate(start.getDate()+idx);
    c.fillText(d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"}),Math.max(0,points[idx].x-18),h-8);
  }
}
function renderAll(){renderCalendar();renderMonthStats();renderOperations();renderChart()}
document.getElementById("prevMonth").onclick=()=>{state.viewDate.setMonth(state.viewDate.getMonth()-1);renderAll()}
document.getElementById("nextMonth").onclick=()=>{state.viewDate.setMonth(state.viewDate.getMonth()+1);renderAll()}
document.getElementById("save").onclick=()=>{
  const k=key(state.selectedDate);
  const h=Number(document.getElementById("hours").value)||0;
  const m=Number(document.getElementById("money").value)||0;
  const b=Number(document.getElementById("bonus").value)||0;
  if(h===0&&m===0&&b===0){
    delete state.records[k];
  }else{
    state.records[k]={hours:h,money:m,bonus:b,savedAt:Date.now()};
  }
  saveData();renderAll();
};
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");state.range=Number(btn.dataset.range);renderChart();
});
window.addEventListener("resize",renderChart);
selectDate(new Date());
</script>
</body>
</html>
